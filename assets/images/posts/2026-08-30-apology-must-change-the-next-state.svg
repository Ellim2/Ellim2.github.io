<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">실패 이후 상태를 바꾸는 네 단계</title><desc id="desc">실패한 실행 카드가 원인 확인, 되돌림, 검증, 다음 경계 카드로 이어지는 가로형 편집 도해.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10151c"/><stop offset="1" stop-color="#202838"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#05070a" flood-opacity=".38"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1260" cy="150" r="290" fill="#31405f" opacity=".3"/><circle cx="280" cy="780" r="250" fill="#bf765c" opacity=".12"/>
<text x="120" y="145" fill="#dfe8f8" font-family="sans-serif" font-size="28" letter-spacing="6">FAILURE IS NOT THE FINAL STATE</text>
<path d="M275 470 H1325" stroke="#7f91b6" stroke-width="4" stroke-dasharray="10 15" opacity=".7"/>
<g filter="url(#shadow)" font-family="sans-serif"><g transform="translate(115 330)"><rect width="260" height="280" rx="18" fill="#c96051"/><text x="30" y="62" fill="#fff5ed" font-size="21" letter-spacing="3">BEFORE</text><text x="30" y="135" fill="white" font-size="38" font-weight="700">어긋난</text><text x="30" y="182" fill="white" font-size="38" font-weight="700">실행</text><path d="M30 220h190" stroke="#ffd2c5" stroke-width="3"/></g>
<g transform="translate(455 295)"><rect width="240" height="350" rx="18" fill="#e6edf8"/><text x="28" y="58" fill="#253755" font-size="20" letter-spacing="2">01</text><text x="28" y="130" fill="#15233a" font-size="33" font-weight="700">사실</text><text x="28" y="174" fill="#15233a" font-size="33" font-weight="700">고정</text><text x="28" y="248" fill="#52627a" font-size="19">관찰과 추측을</text><text x="28" y="276" fill="#52627a" font-size="19">분리한다</text></g>
<g transform="translate(730 295)"><rect width="240" height="350" rx="18" fill="#b8d7cf"/><text x="28" y="58" fill="#244840" font-size="20" letter-spacing="2">02</text><text x="28" y="130" fill="#133c34" font-size="33" font-weight="700">영향</text><text x="28" y="174" fill="#133c34" font-size="33" font-weight="700">축소</text><text x="28" y="248" fill="#35665c" font-size="19">되돌릴 수 있는</text><text x="28" y="276" fill="#35665c" font-size="19">범위를 먼저 줄인다</text></g>
<g transform="translate(1005 295)"><rect width="240" height="350" rx="18" fill="#f1d595"/><text x="28" y="58" fill="#654d16" font-size="20" letter-spacing="2">03 · 04</text><text x="28" y="130" fill="#4d3708" font-size="33" font-weight="700">검증과</text><text x="28" y="174" fill="#4d3708" font-size="33" font-weight="700">다음 경계</text><text x="28" y="248" fill="#786122" font-size="19">결과를 다시 보고</text><text x="28" y="276" fill="#786122" font-size="19">한 칸을 바꾼다</text></g></g>
<path d="M395 470l35-20v40zM675 470l35-20v40zM955 470l35-20v40z" fill="#dce6fa"/>
<text x="120" y="760" fill="#bdc9de" font-family="sans-serif" font-size="31">말은 출발점이다. 책임은 다음 상태의 차이로 확인된다.</text>
</svg>