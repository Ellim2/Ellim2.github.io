<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">보류를 결정 상태로 다루는 협업 도해</title>
  <desc id="desc">즉시 실행, 보류, 중단의 세 갈래가 근거와 경계, 다음 확인 조건에 따라 나뉘는 가로형 편집 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#10283A"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1305" cy="135" r="185" fill="#20B8A7" opacity=".10" filter="url(#glow)"/>
  <circle cx="260" cy="770" r="250" fill="#E6A44B" opacity=".08" filter="url(#glow)"/>
  <text x="112" y="126" fill="#A8BEC9" font-family="system-ui, sans-serif" font-size="26" letter-spacing="5">COLLABORATION NOTE / 03</text>
  <text x="112" y="202" fill="#F4F1E8" font-family="system-ui, sans-serif" font-size="57" font-weight="700">보류는 빈 칸이 아니라</text>
  <text x="112" y="274" fill="#F4F1E8" font-family="system-ui, sans-serif" font-size="57" font-weight="700">다음 판단을 위한 상태다</text>
  <line x1="112" y1="330" x2="1488" y2="330" stroke="#5D7885" opacity=".55"/>
  <text x="112" y="392" fill="#A8BEC9" font-family="system-ui, sans-serif" font-size="24">확인된 근거 · 넘지 않을 경계 · 다시 시작할 조건</text>
  <path d="M390 530 H550 M550 530 C610 530 615 465 680 465 H760 M550 530 C610 530 615 620 680 620 H760 M550 530 H760" fill="none" stroke="#7C99A6" stroke-width="3"/>
  <circle cx="390" cy="530" r="76" fill="#122E40" stroke="#A8BEC9" stroke-width="2"/>
  <text x="390" y="520" text-anchor="middle" fill="#F4F1E8" font-family="system-ui, sans-serif" font-size="26" font-weight="700">지금의</text>
  <text x="390" y="554" text-anchor="middle" fill="#F4F1E8" font-family="system-ui, sans-serif" font-size="26" font-weight="700">판단</text>
  <g font-family="system-ui, sans-serif">
    <rect x="760" y="394" width="592" height="142" rx="14" fill="#113B3B" stroke="#3AC3B2" stroke-width="2"/>
    <text x="804" y="448" fill="#63E3D1" font-size="22" font-weight="700" letter-spacing="2">EXECUTE</text>
    <text x="804" y="494" fill="#F4F1E8" font-size="34" font-weight="700">근거가 충분하면 실행</text>
    <rect x="760" y="550" width="592" height="142" rx="14" fill="#342C22" stroke="#E6A44B" stroke-width="2"/>
    <text x="804" y="604" fill="#F0B95F" font-size="22" font-weight="700" letter-spacing="2">HOLD</text>
    <text x="804" y="650" fill="#F4F1E8" font-size="34" font-weight="700">조건을 남기고 보류</text>
    <rect x="760" y="706" width="592" height="104" rx="14" fill="#292934" stroke="#B2A6D7" stroke-width="2"/>
    <text x="804" y="750" fill="#CFC7ED" font-size="22" font-weight="700" letter-spacing="2">STOP</text>
    <text x="804" y="786" fill="#F4F1E8" font-size="28" font-weight="700">경계를 넘으면 중단</text>
  </g>
  <text x="112" y="842" fill="#A8BEC9" font-family="system-ui, sans-serif" font-size="22">A decision can be incomplete — and still be accountable.</text>
</svg>