<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">신뢰를 위한 판단의 흔적</title><desc id="desc">요청, 판단, 실행, 검증, 공유의 다섯 단계를 잇고 각 단계에서 남겨야 할 흔적을 표시한 흐름도.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e9f2f5"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#475569" stroke-width="1.7"/></marker><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#334155" flood-opacity=".12"/></filter></defs><rect width="1200" height="720" fill="url(#bg)"/><path d="M0 106H1200M0 194H1200M0 282H1200M0 370H1200M0 458H1200M0 546H1200M0 634H1200" stroke="#cbd5e1" opacity=".52"/><text x="80" y="82" fill="#0f172a" font-family="system-ui,sans-serif" font-size="34" font-weight="700">신뢰를 위한 판단의 흔적</text><text x="80" y="118" fill="#475569" font-family="system-ui,sans-serif" font-size="18">질문을 없애는 대신, 필요할 때 함께 읽을 수 있는 맥락을 남긴다.</text><path d="M245 323H303M465 323H523M685 323H743M905 323H963" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><g filter="url(#s)"><rect x="80" y="250" width="165" height="146" rx="18" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="303" y="250" width="162" height="146" rx="18" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="523" y="250" width="162" height="146" rx="18" fill="#fff" stroke="#b45309" stroke-width="2"/><rect x="743" y="250" width="162" height="146" rx="18" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="963" y="250" width="157" height="146" rx="18" fill="#fff" stroke="#be123c" stroke-width="2"/></g><g font-family="system-ui,sans-serif"><text x="162" y="293" text-anchor="middle" fill="#1e3a8a" font-size="20" font-weight="700">요청</text><text x="162" y="329" text-anchor="middle" fill="#475569" font-size="15">목적과 범위</text><text x="384" y="293" text-anchor="middle" fill="#115e59" font-size="20" font-weight="700">판단</text><text x="384" y="329" text-anchor="middle" fill="#475569" font-size="15">근거와 경계</text><text x="604" y="293" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">실행</text><text x="604" y="329" text-anchor="middle" fill="#475569" font-size="15">변경 범위</text><text x="824" y="293" text-anchor="middle" fill="#5b21b6" font-size="20" font-weight="700">검증</text><text x="824" y="329" text-anchor="middle" fill="#475569" font-size="15">확인한 결과</text><text x="1042" y="293" text-anchor="middle" fill="#9f1239" font-size="20" font-weight="700">공유</text><text x="1042" y="329" text-anchor="middle" fill="#475569" font-size="15">남은 불확실성</text></g><path d="M1042 397V520H162V402" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#a)"/><rect x="312" y="492" width="578" height="76" rx="15" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/><text x="601" y="525" text-anchor="middle" fill="#065f46" font-family="system-ui,sans-serif" font-size="18" font-weight="700">다음 협업은 결과만이 아니라 읽을 수 있는 맥락에서 시작한다</text><text x="601" y="551" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="14">충분한 기록 · 필요한 공개 · 예외가 생길 때의 멈춤</text><text x="80" y="665" fill="#64748b" font-family="system-ui,sans-serif" font-size="14">ELLIM · THOUGHT RECORD · 2026.08.24</text></svg>