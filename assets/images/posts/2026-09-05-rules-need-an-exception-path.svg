<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">기준선과 검토된 예외 경로</title><desc id="desc">기본 규칙에서 일반 경로와 검토된 예외 경로가 갈라졌다가 공통 확인 지점으로 이어지는 도해</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#102b47"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="10"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><g opacity=".15" stroke="#a8c7df"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/><path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g>
  <text x="120" y="148" fill="#eaf4ff" font-family="system-ui, sans-serif" font-size="28" letter-spacing="5">ELLIM / THOUGHTS</text><text x="120" y="212" fill="#eaf4ff" font-family="system-ui, sans-serif" font-size="48" font-weight="700">규칙은 예외의 길까지 품어야 한다</text>
  <path d="M190 466 H500" stroke="#6f99b8" stroke-width="12" stroke-linecap="round"/><circle cx="190" cy="466" r="23" fill="#c5e5ff"/><rect x="240" y="402" width="260" height="128" rx="18" fill="#102b47" stroke="#81b2d5" stroke-width="2"/><text x="272" y="454" fill="#dff1ff" font-family="system-ui, sans-serif" font-size="25">기본 규칙</text><text x="272" y="493" fill="#8fb5d2" font-family="system-ui, sans-serif" font-size="19">반복 가능한 출발점</text>
  <path d="M500 466 C650 466 630 340 790 340 H970" stroke="#75c9b8" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M500 466 C650 466 630 592 790 592 H970" stroke="#f2ba72" stroke-width="12" fill="none" stroke-linecap="round"/>
  <rect x="760" y="270" width="260" height="136" rx="18" fill="#123d42" stroke="#75c9b8" stroke-width="2"/><text x="792" y="324" fill="#e4fff8" font-family="system-ui, sans-serif" font-size="25">일반 경로</text><text x="792" y="365" fill="#a7dfd2" font-family="system-ui, sans-serif" font-size="19">기준대로 확인</text>
  <rect x="720" y="522" width="340" height="136" rx="18" fill="#493725" stroke="#f2ba72" stroke-width="2"/><text x="752" y="576" fill="#fff3df" font-family="system-ui, sans-serif" font-size="25">검토된 예외</text><text x="752" y="617" fill="#f4cc97" font-family="system-ui, sans-serif" font-size="19">조건 · 대체 확인 · 범위</text>
  <path d="M1020 340 C1120 340 1125 466 1230 466 M1060 592 C1140 592 1140 466 1230 466" stroke="#a8c7df" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="1230" cy="466" r="28" fill="#eaf4ff"/><circle cx="1230" cy="466" r="48" fill="#c5e5ff" opacity=".12" filter="url(#glow)"/><path d="M1260 466H1430" stroke="#c5e5ff" stroke-width="12" stroke-linecap="round"/><text x="1165" y="550" fill="#eaf4ff" font-family="system-ui, sans-serif" font-size="23">공통 확인</text><text x="120" y="790" fill="#8fb5d2" font-family="system-ui, sans-serif" font-size="24">일관성은 같은 답이 아니라, 달라진 조건에도 같은 책임으로 답하는 데 있다.</text>
</svg>