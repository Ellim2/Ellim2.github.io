<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">모호한 요청에서 결정자를 분명히 하는 세 갈래</title><desc id="desc">모호한 요청이 되돌릴 수 있는 실행, 확인이 필요한 선택, 사람의 결정으로 나뉘는 도해</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1b32"/><stop offset="1" stop-color="#17233d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-opacity=".24"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="117" cy="118" r="260" fill="#2c74a8" opacity=".13"/><circle cx="1490" cy="800" r="320" fill="#e28b58" opacity=".12"/>
<text x="110" y="120" fill="#b8c8df" font-family="Arial, sans-serif" font-size="25" letter-spacing="5">DECISION BOUNDARY</text><text x="110" y="175" fill="#f6f2e9" font-family="Arial, sans-serif" font-size="52" font-weight="700">질문은 멈춤이 아니라 경계를 만든다</text>
<g filter="url(#s)"><rect x="110" y="300" width="330" height="260" rx="24" fill="#e8edf3"/><text x="150" y="370" fill="#1b2b43" font-family="Arial, sans-serif" font-size="24" letter-spacing="3">AMBIGUOUS REQUEST</text><text x="150" y="430" fill="#17233d" font-family="Arial, sans-serif" font-size="39" font-weight="700">모호한 요청</text><line x1="150" y1="466" x2="390" y2="466" stroke="#91a4bc"/><text x="150" y="510" fill="#40536b" font-family="Arial, sans-serif" font-size="22">모르는 것과</text><text x="150" y="540" fill="#40536b" font-family="Arial, sans-serif" font-size="22">결정할 일을 나눈다</text></g>
<path d="M455 430 H570 M570 430 V270 H650 M570 430 H650 M570 430 V600 H650" fill="none" stroke="#9cb1c8" stroke-width="5" stroke-linecap="round"/>
<g filter="url(#s)"><rect x="680" y="175" width="700" height="175" rx="24" fill="#b8ddd4"/><text x="725" y="235" fill="#175248" font-family="Arial, sans-serif" font-size="22" letter-spacing="3">REVERSIBLE EXECUTION</text><text x="725" y="293" fill="#123d36" font-family="Arial, sans-serif" font-size="35" font-weight="700">작게 실행하고, 결과를 확인한다</text></g>
<g filter="url(#s)"><rect x="680" y="365" width="700" height="175" rx="24" fill="#f2d79d"/><text x="725" y="425" fill="#725313" font-family="Arial, sans-serif" font-size="22" letter-spacing="3">CHOICE NEEDS CONTEXT</text><text x="725" y="483" fill="#5c4210" font-family="Arial, sans-serif" font-size="35" font-weight="700">비교할 초안으로 선택을 가볍게 한다</text></g>
<g filter="url(#s)"><rect x="680" y="555" width="700" height="175" rx="24" fill="#e9b5aa"/><text x="725" y="615" fill="#81382e" font-family="Arial, sans-serif" font-size="22" letter-spacing="3">HUMAN DECISION</text><text x="725" y="673" fill="#682d26" font-family="Arial, sans-serif" font-size="35" font-weight="700">공개·비용·비가역성은 결정자를 남긴다</text></g>
<text x="110" y="810" fill="#b8c8df" font-family="Arial, sans-serif" font-size="23">속도는 답을 빨리 내는 데서가 아니라, 책임의 자리를 잃지 않는 데서 나온다.</text></svg>