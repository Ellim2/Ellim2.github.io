<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">작업 기록의 생성 우선 이미지 발행 흐름</title>
  <desc id="desc">글의 핵심을 시각적으로 해석하는 생성 이미지 경로를 우선 시도하고, 생성 경로가 불가능하거나 구조 정확성이 더 중요할 때만 이유를 남기고 안전한 구조 도해를 사용하는 흐름.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#020617"/>
  <rect width="1200" height="720" fill="url(#grid)" opacity=".8"/>
  <text x="72" y="82" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="30" font-weight="700">이미지는 존재보다 역할이 먼저다</text>
  <text x="72" y="116" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16">작업 기록 발행의 생성 우선 경로와 검증 가능한 예외</text>
  <path d="M300 320H395M650 320H745" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M650 350C710 410 730 500 780 518" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <g font-family="ui-monospace, SFMono-Regular, monospace">
    <rect x="72" y="225" width="228" height="190" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <text x="98" y="274" fill="#67e8f9" font-size="14" font-weight="700">01 / 글의 핵심</text>
    <text x="98" y="320" fill="#f8fafc" font-size="24" font-weight="700">주제와 변화</text>
    <text x="98" y="354" fill="#cbd5e1" font-size="15">무엇을 시각적으로</text><text x="98" y="378" fill="#cbd5e1" font-size="15">해석할 것인가</text>
    <rect x="395" y="225" width="255" height="190" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="422" y="274" fill="#6ee7b7" font-size="14" font-weight="700">02 / 기본 경로</text>
    <text x="422" y="320" fill="#f8fafc" font-size="24" font-weight="700">생성 이미지 시도</text>
    <text x="422" y="354" fill="#cbd5e1" font-size="15">가로형 · 텍스트 최소화</text><text x="422" y="378" fill="#cbd5e1" font-size="15">안전한 편집 해석</text>
    <rect x="745" y="225" width="380" height="190" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <text x="772" y="274" fill="#c4b5fd" font-size="14" font-weight="700">03 / 발행 전 확인</text>
    <text x="772" y="320" fill="#f8fafc" font-size="24" font-weight="700">본문 · 빌드 · 공개 URL</text>
    <text x="772" y="354" fill="#cbd5e1" font-size="15">이미지 참조와 렌더링을</text><text x="772" y="378" fill="#cbd5e1" font-size="15">같이 검증한다</text>
    <rect x="745" y="488" width="380" height="144" rx="14" fill="#25131c" stroke="#fb7185" stroke-width="2"/>
    <text x="772" y="532" fill="#fda4af" font-size="14" font-weight="700">제한된 FALLBACK</text>
    <text x="772" y="570" fill="#f8fafc" font-size="21" font-weight="700">안전한 구조 도해</text>
    <text x="772" y="604" fill="#fecdd3" font-size="14">생성 불가 또는 정확성 우선일 때만</text>
  </g>
  <text x="72" y="677" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14">fallback을 사용하면 이유를 발행 결과에 남긴다.</text>
</svg>
