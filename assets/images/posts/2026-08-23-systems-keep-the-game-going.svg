<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">목표와 시스템을 구분하는 판단 지도</title><desc id="desc">목표는 방향을 정하고, 시스템은 오늘의 반복을 설계하며, 점검은 누적 신호를 보고 조정하는 순환 구조를 나타낸다.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e8f0f7"/></linearGradient><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L10,5.5 L1,10" fill="none" stroke="#475569" stroke-width="1.7"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#334155" flood-opacity=".12"/></filter></defs><rect width="1200" height="720" fill="url(#bg)"/><path d="M0 92H1200M0 180H1200M0 268H1200M0 356H1200M0 444H1200M0 532H1200M0 620H1200" stroke="#cbd5e1" stroke-width="1" opacity=".55"/><text x="80" y="82" fill="#0f172a" font-family="system-ui, sans-serif" font-size="34" font-weight="700">계속할 수 있게 만드는 판단</text><text x="80" y="118" fill="#475569" font-family="system-ui, sans-serif" font-size="18">결과를 향한 방향과 오늘의 반복을 분리하면, 보이지 않는 축적도 관리할 수 있다.</text><g filter="url(#shadow)"><rect x="80" y="210" width="290" height="205" rx="20" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="455" y="210" width="290" height="205" rx="20" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="830" y="210" width="290" height="205" rx="20" fill="#fff" stroke="#b45309" stroke-width="2"/></g><path d="M370 312H450" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M745 312H825" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M975 415V520H225V420" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow)"/><circle cx="120" cy="253" r="12" fill="#2563eb"/><text x="145" y="261" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="17" font-weight="700">방향: 목표</text><text x="112" y="306" fill="#0f172a" font-family="system-ui, sans-serif" font-size="25" font-weight="700">어디로 갈 것인가</text><text x="112" y="342" fill="#475569" font-family="system-ui, sans-serif" font-size="17">측정할 결과와 제약을 정한다.</text><text x="112" y="374" fill="#64748b" font-family="system-ui, sans-serif" font-size="15">목표만으로 오늘의 행동은 정해지지 않는다.</text><circle cx="495" cy="253" r="12" fill="#0f766e"/><text x="520" y="261" fill="#115e59" font-family="system-ui, sans-serif" font-size="17" font-weight="700">반복: 시스템</text><text x="487" y="306" fill="#0f172a" font-family="system-ui, sans-serif" font-size="25" font-weight="700">오늘 무엇을 할까</text><text x="487" y="342" fill="#475569" font-family="system-ui, sans-serif" font-size="17">작게 시작하고, 마찰을 낮추고,</text><text x="487" y="370" fill="#475569" font-family="system-ui, sans-serif" font-size="17">중단 뒤에도 돌아올 길을 남긴다.</text><circle cx="870" cy="253" r="12" fill="#b45309"/><text x="895" y="261" fill="#92400e" font-family="system-ui, sans-serif" font-size="17" font-weight="700">학습: 점검</text><text x="862" y="306" fill="#0f172a" font-family="system-ui, sans-serif" font-size="25" font-weight="700">무엇을 바꿀까</text><text x="862" y="342" fill="#475569" font-family="system-ui, sans-serif" font-size="17">짧은 결과가 아니라 누적 신호를 보고</text><text x="862" y="370" fill="#475569" font-family="system-ui, sans-serif" font-size="17">방향과 방식을 함께 조정한다.</text><rect x="80" y="555" width="1040" height="86" rx="16" fill="#0f172a"/><text x="116" y="590" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="17" font-weight="600">질문</text><text x="116" y="620" fill="#fff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">이 행동은 결과를 한 번 만드는가, 아니면 다음에도 계속할 수 있는 조건을 만드는가?</text></svg>