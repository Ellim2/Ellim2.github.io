<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">GitHub 검색 결과의 관측 범위</title><desc id="desc">검색 결과가 접근 가능한 저장소, 권한 밖의 저장소, 확인 가능한 결론으로 나뉘는 도해</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a30"/><stop offset="1" stop-color="#202744"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="15" stdDeviation="16" flood-opacity=".24"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="133" cy="132" r="300" fill="#4381a7" opacity=".14"/><circle cx="1515" cy="787" r="310" fill="#d28b62" opacity=".13"/>
<text x="110" y="120" fill="#b7c8df" font-family="Arial, sans-serif" font-size="25" letter-spacing="5">OBSERVATION SCOPE</text><text x="110" y="177" fill="#f7f2e9" font-family="Arial, sans-serif" font-size="51" font-weight="700">검색 결과의 빈칸은 범위의 끝일 수 있다</text>
<g filter="url(#shadow)"><rect x="110" y="295" width="320" height="285" rx="25" fill="#e8edf4"/><text x="150" y="365" fill="#22334f" font-family="Arial, sans-serif" font-size="22" letter-spacing="3">SEARCH RESULT</text><text x="150" y="425" fill="#182844" font-family="Arial, sans-serif" font-size="45" font-weight="700">0 results</text><line x1="150" y1="468" x2="390" y2="468" stroke="#93a7c0"/><text x="150" y="515" fill="#485b73" font-family="Arial, sans-serif" font-size="22">결과를 읽기 전에</text><text x="150" y="547" fill="#485b73" font-family="Arial, sans-serif" font-size="22">관측 창을 확인한다</text></g>
<path d="M445 435 H555 M555 435 V275 H630 M555 435 H630 M555 435 V595 H630" fill="none" stroke="#9eb2c9" stroke-width="5" stroke-linecap="round"/>
<g filter="url(#shadow)"><rect x="665" y="178" width="720" height="185" rx="25" fill="#b8dacf"/><text x="710" y="240" fill="#225248" font-family="Arial, sans-serif" font-size="22" letter-spacing="3">ACCESSIBLE NOW</text><text x="710" y="300" fill="#173f38" font-family="Arial, sans-serif" font-size="37" font-weight="700">현재 접근 가능한 저장소</text><text x="710" y="334" fill="#35645b" font-family="Arial, sans-serif" font-size="23">확인한 정의와 실행 기록으로만 말한다</text></g>
<g filter="url(#shadow)"><rect x="665" y="390" width="720" height="185" rx="25" fill="#f2d69d"/><text x="710" y="452" fill="#735312" font-family="Arial, sans-serif" font-size="22" letter-spacing="3">OUTSIDE THE WINDOW</text><text x="710" y="512" fill="#60430e" font-family="Arial, sans-serif" font-size="37" font-weight="700">권한 밖의 비공개 저장소</text><text x="710" y="546" fill="#795d1f" font-family="Arial, sans-serif" font-size="23">0건이 곧 존재하지 않음은 아니다</text></g>
<g filter="url(#shadow)"><rect x="665" y="602" width="720" height="150" rx="25" fill="#d9b6bd"/><text x="710" y="661" fill="#783746" font-family="Arial, sans-serif" font-size="22" letter-spacing="3">VERIFIABLE CONCLUSION</text><text x="710" y="717" fill="#5e2a35" font-family="Arial, sans-serif" font-size="34" font-weight="700">범위가 붙은 결론만 남긴다</text></g>
<text x="110" y="820" fill="#b7c8df" font-family="Arial, sans-serif" font-size="23">찾지 못한 것과 없는 것은 다르다. 다음 확인 경로를 남긴다.</text></svg>