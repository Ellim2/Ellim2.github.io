<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">반복과 재검토의 경계</title><desc id="desc">짙은 밤색 배경 위에서 작은 카드들이 원을 따라 반복되고, 한쪽에 열린 관문과 검토 질문이 놓인 편집 도해.</desc>
<defs><linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a2b"/><stop offset="1" stop-color="#26364b"/></linearGradient><radialGradient id="glow"><stop stop-color="#e6b55b" stop-opacity=".28"/><stop offset="1" stop-color="#e6b55b" stop-opacity="0"/></radialGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#050a12" flood-opacity=".45"/></filter></defs>
<rect width="1200" height="720" fill="url(#night)"/><circle cx="600" cy="368" r="315" fill="url(#glow)"/><path d="M272 407c-15-178 113-307 286-307 136 0 258 80 306 197M917 273c57 162-29 337-191 391-142 47-298-1-375-111" fill="none" stroke="#7893ad" stroke-width="2" stroke-dasharray="7 13" opacity=".7"/>
<g filter="url(#shadow)"><g transform="translate(286 317) rotate(-20)"><rect width="148" height="96" rx="12" fill="#f1eadb"/><path d="M20 29h75M20 48h106M20 67h57" stroke="#738092" stroke-width="5" stroke-linecap="round"/><circle cx="119" cy="25" r="9" fill="#e6b55b"/></g><g transform="translate(454 153) rotate(-4)"><rect width="148" height="96" rx="12" fill="#d7e5e3"/><path d="M20 29h88M20 48h104M20 67h68" stroke="#527477" stroke-width="5" stroke-linecap="round"/><circle cx="119" cy="25" r="9" fill="#e6b55b"/></g><g transform="translate(674 170) rotate(17)"><rect width="148" height="96" rx="12" fill="#e3dced"/><path d="M20 29h79M20 48h106M20 67h54" stroke="#66598a" stroke-width="5" stroke-linecap="round"/><circle cx="119" cy="25" r="9" fill="#e6b55b"/></g><g transform="translate(801 382) rotate(29)"><rect width="148" height="96" rx="12" fill="#f1eadb"/><path d="M20 29h88M20 48h104M20 67h68" stroke="#738092" stroke-width="5" stroke-linecap="round"/><circle cx="119" cy="25" r="9" fill="#e6b55b"/></g><g transform="translate(597 539) rotate(5)"><rect width="148" height="96" rx="12" fill="#d7e5e3"/><path d="M20 29h79M20 48h106M20 67h54" stroke="#527477" stroke-width="5" stroke-linecap="round"/><circle cx="119" cy="25" r="9" fill="#e6b55b"/></g></g>
<g transform="translate(148 202)" filter="url(#shadow)" font-family="Pretendard, Apple SD Gothic Neo, sans-serif"><path d="M0 50V14a14 14 0 0 1 14-14h104a14 14 0 0 1 14 14v36" fill="none" stroke="#e6b55b" stroke-width="7"/><path d="M16 50V114a14 14 0 0 0 14 14h72a14 14 0 0 0 14-14V50" fill="#182c40" stroke="#e6b55b" stroke-width="4"/><path d="M50 84h31" stroke="#e6b55b" stroke-width="5" stroke-linecap="round"/><text x="-8" y="168" fill="#f4ead9" font-size="19" font-weight="700">다시 여는 관문</text><text x="-8" y="198" fill="#aec2d3" font-size="15">입력 · 영향 · 근거 · 목적</text></g>
<g font-family="Pretendard, Apple SD Gothic Neo, sans-serif"><text x="92" y="82" fill="#e6b55b" font-size="17" font-weight="700" letter-spacing="2">THOUGHT NOTE</text><text x="92" y="126" fill="#f5f0e7" font-size="34" font-weight="700">반복을 맡길수록, 판단을 다시 여는 지점이 필요하다</text><text x="92" y="158" fill="#b7c7d5" font-size="18">절차는 고정해도, 달라진 조건을 알아차릴 문은 남겨 둔다.</text><text x="92" y="675" fill="#94aabb" font-size="15">반복은 관성이 아니라, 재검토할 여지를 가진 구조여야 한다.</text></g></svg>
