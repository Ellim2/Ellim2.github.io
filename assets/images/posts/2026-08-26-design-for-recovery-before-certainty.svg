<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">복구 가능한 선택을 만드는 판단 흐름도</title>
  <desc id="desc">불확실한 요청에서 영향 범위, 되돌림 경로, 관측 지점을 확인한 뒤 작은 실행을 하고 다음 선택으로 이어지는 흐름.</desc>
  <rect width="1200" height="720" fill="#f7f6f2"/><rect x="58" y="54" width="1084" height="94" rx="18" fill="#17324d"/>
  <text x="102" y="99" fill="#f7f6f2" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="700">확신이 부족할수록, 복구 가능한 선택부터 만든다</text><text x="102" y="126" fill="#c9d7e2" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17">불확실성을 추측이나 정지로 처리하지 않고, 안전하게 정보를 얻는 판단의 순서</text>
  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif"><path d="M284 321H322 M544 321H582 M804 321H842" stroke="#567" stroke-width="3"/><path d="M310 310l14 11-14 11 M570 310l14 11-14 11 M830 310l14 11-14 11" fill="none" stroke="#567" stroke-width="3"/><path d="M950 405V474" stroke="#567" stroke-width="3"/><path d="M939 462l11 14 11-14" fill="none" stroke="#567" stroke-width="3"/>
  <rect x="70" y="222" width="214" height="170" rx="18" fill="#dbe9e2" stroke="#30755c" stroke-width="2"/><text x="96" y="270" fill="#173d31" font-size="17" font-weight="700">1 · 확인된 요청</text><text x="96" y="307" fill="#173d31" font-size="22" font-weight="700">무엇을 아는가?</text><text x="96" y="339" fill="#355648" font-size="16">목적 · 경계 · 제약</text><text x="96" y="365" fill="#355648" font-size="16">모르는 부분도 표시</text>
  <rect x="330" y="222" width="214" height="170" rx="18" fill="#f5e8c6" stroke="#b78123" stroke-width="2"/><text x="356" y="270" fill="#654610" font-size="17" font-weight="700">2 · 영향 범위</text><text x="356" y="307" fill="#654610" font-size="22" font-weight="700">누가, 무엇이 변하나?</text><text x="356" y="339" fill="#795a1e" font-size="16">공개성 · 비용 · 권한</text><text x="356" y="365" fill="#795a1e" font-size="16">작아 보이는 위험 점검</text>
  <rect x="590" y="222" width="214" height="170" rx="18" fill="#e5e1f0" stroke="#695b9b" stroke-width="2"/><text x="616" y="270" fill="#40366b" font-size="17" font-weight="700">3 · 복구와 관측</text><text x="616" y="307" fill="#40366b" font-size="22" font-weight="700">틀리면 어떻게 하나?</text><text x="616" y="339" fill="#554b78" font-size="16">되돌림 경로 · 비용</text><text x="616" y="365" fill="#554b78" font-size="16">계속·중단의 신호</text>
  <rect x="850" y="222" width="280" height="170" rx="18" fill="#dce8f0" stroke="#47738c" stroke-width="2"/><text x="876" y="270" fill="#24485b" font-size="17" font-weight="700">4 · 크기에 맞는 행동</text><text x="876" y="307" fill="#24485b" font-size="22" font-weight="700">작게 실행하거나 질문</text><text x="876" y="339" fill="#365d70" font-size="16">안전한 범위: 실행 후 확인</text><text x="876" y="365" fill="#365d70" font-size="16">되돌리기 어려움: 먼저 멈춤</text>
  <rect x="238" y="493" width="724" height="142" rx="20" fill="#17324d"/><text x="286" y="538" fill="#a7d7c5" font-size="17" font-weight="700">다음 판단을 위한 여지</text><text x="286" y="578" fill="#fff" font-size="26" font-weight="700">실행 결과를 관측하고, 계속 · 복구 · 질문을 선택한다</text><text x="286" y="612" fill="#c9d7e2" font-size="17">복구 가능성은 실패를 숨기지 않고 더 나은 근거를 얻기 위한 구조다.</text></g>
</svg>
