<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">자동화의 침묵을 읽는 구조</title><desc id="desc">정상과 실패 사이의 조용한 공백이 기록, 경고, 재검토 경로를 통해 확인 가능한 상태로 바뀌는 도해</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#182442"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020817" flood-opacity=".42"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1450" cy="110" r="290" fill="#3b82f6" opacity=".12"/><circle cx="130" cy="790" r="270" fill="#2dd4bf" opacity=".09"/>
  <text x="110" y="122" fill="#eef5ff" font-family="Arial, sans-serif" font-size="31" font-weight="700">자동화의 침묵을 읽는 방식</text><text x="110" y="170" fill="#aabbd5" font-family="Arial, sans-serif" font-size="21">알림이 없다는 사실을 추측이 아니라 다음 판단 가능한 상태로 바꾼다</text>
  <path d="M390 406 H520 M830 406 H960 M1270 406 H1400" stroke="#67e8d9" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M520 406 l-20 -12 v24z M960 406 l-20 -12 v24z M1400 406 l-20 -12 v24z" fill="#67e8d9"/>
  <g filter="url(#shadow)"><rect x="110" y="310" width="280" height="195" rx="24" fill="#122843" stroke="#315577"/><rect x="520" y="265" width="310" height="285" rx="24" fill="#173f51" stroke="#58d5c6" stroke-width="2"/><rect x="960" y="310" width="310" height="195" rx="24" fill="#122843" stroke="#315577"/></g>
  <text x="146" y="365" fill="#75e6d9" font-family="Arial, sans-serif" font-size="18" font-weight="700">RUN</text><text x="146" y="415" fill="#f5f9ff" font-family="Arial, sans-serif" font-size="33" font-weight="700">실행 신호</text><text x="146" y="456" fill="#b6c6dc" font-family="Arial, sans-serif" font-size="20">언제, 무엇을 했는가</text>
  <text x="557" y="326" fill="#93fff1" font-family="Arial, sans-serif" font-size="18" font-weight="700">MAKE SILENCE LEGIBLE</text><text x="557" y="379" fill="#fff" font-family="Arial, sans-serif" font-size="33" font-weight="700">조용한 공백</text><text x="557" y="425" fill="#c5e3e2" font-family="Arial, sans-serif" font-size="21">완료 · 변경 없음</text><text x="557" y="461" fill="#c5e3e2" font-family="Arial, sans-serif" font-size="21">안전한 중단 · 실패</text><text x="557" y="510" fill="#91bfc1" font-family="Arial, sans-serif" font-size="17">상태마다 다음 행동을 다르게 한다</text>
  <text x="996" y="365" fill="#75e6d9" font-family="Arial, sans-serif" font-size="18" font-weight="700">RECOVER</text><text x="996" y="415" fill="#f5f9ff" font-family="Arial, sans-serif" font-size="33" font-weight="700">기록 · 경고</text><text x="996" y="456" fill="#b6c6dc" font-family="Arial, sans-serif" font-size="20">다시 볼 곳과 다음 행동</text>
  <line x1="110" y1="650" x2="1490" y2="650" stroke="#36506f"/><text x="110" y="724" fill="#eef5ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">침묵은 성공의 증거가 아니다. 확인 가능한 상태일 때만 신호가 된다.</text><text x="110" y="773" fill="#aabbd5" font-family="Arial, sans-serif" font-size="20">ELLIM · THOUGHTS / 2026.09.03</text>
</svg>
