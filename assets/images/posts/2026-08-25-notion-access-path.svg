<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">노션 접근 경로 확인 흐름도</title><desc id="d">요청에서 실행 환경, 권한, 공유 범위, 실제 읽기 검증으로 이어지는 흐름도</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect width="1200" height="680" fill="#020617"/><rect width="1200" height="680" fill="url(#g)" opacity=".6"/><g font-family="monospace"><text x="65" y="85" fill="#e2e8f0" font-size="29" font-weight="700">접근은 ‘연결됨’이 아니라 ‘실행 경로가 완성됨’으로 확인한다</text><text x="65" y="120" fill="#94a3b8" font-size="16">도구 설치 · 실행 환경 · 권한 주입 · 공유 범위 · 실제 읽기 요청</text></g><g fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"><path d="M270 340H335"/><path d="M540 340H605"/><path d="M810 340H875"/><path d="M1030 430C930 560 700 570 600 490" stroke="#34d399" stroke-dasharray="8 8"/></g><g font-family="monospace"><g><rect x="65" y="255" width="205" height="170" rx="15" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="90" y="300" fill="#67e8f9" font-size="17">1. 요청</text><text x="90" y="345" fill="#e2e8f0" font-size="21">대상과 목적</text><text x="90" y="380" fill="#94a3b8" font-size="14">무엇을 읽을까?</text></g><g><rect x="335" y="255" width="205" height="170" rx="15" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="360" y="300" fill="#fde68a" font-size="17">2. 실행 환경</text><text x="360" y="345" fill="#e2e8f0" font-size="21">도구 경로</text><text x="360" y="380" fill="#94a3b8" font-size="14">여기서 실행되는가?</text></g><g><rect x="605" y="255" width="205" height="170" rx="15" fill="#0f172a" stroke="#fb7185" stroke-width="2"/><text x="630" y="300" fill="#fda4af" font-size="17">3. 권한 주입</text><text x="630" y="345" fill="#e2e8f0" font-size="21">필요한 키만</text><text x="630" y="380" fill="#94a3b8" font-size="14">값은 노출하지 않는다</text></g><g><rect x="875" y="255" width="205" height="170" rx="15" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="900" y="300" fill="#c4b5fd" font-size="17">4. 공유 범위</text><text x="900" y="345" fill="#e2e8f0" font-size="21">대상을 제한</text><text x="900" y="380" fill="#94a3b8" font-size="14">필요한 페이지·DB만</text></g><rect x="425" y="505" width="370" height="90" rx="15" fill="#063b31" stroke="#34d399" stroke-width="2"/><text x="452" y="545" fill="#6ee7b7" font-size="18">5. 읽기 전용 요청으로 검증</text><text x="452" y="575" fill="#d1fae5" font-size="14">성공 · 권한 오류 · 미설정 상태를 구분</text></g></svg>