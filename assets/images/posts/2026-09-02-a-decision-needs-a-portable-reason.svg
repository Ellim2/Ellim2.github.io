<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">판단을 이어받는 구조</title><desc id="desc">요청과 제약이 판단으로 모이고, 실행과 검토를 거쳐 다음 판단으로 연결되는 도해</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081526"/><stop offset="1" stop-color="#172448"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020817" flood-opacity=".35"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1380" cy="130" r="260" fill="#4f46e5" opacity=".14"/><circle cx="180" cy="760" r="260" fill="#14b8a6" opacity=".1"/>
  <text x="110" y="125" fill="#e7eefc" font-family="Arial, sans-serif" font-size="30" font-weight="700">판단이 다음 사람에게 남는 방식</text><text x="110" y="172" fill="#9fb0cc" font-family="Arial, sans-serif" font-size="21">결과만이 아니라 선택의 목적·제약·재검토 조건을 함께 남긴다</text>
  <path d="M390 405 H560 M860 405 H1030 M1290 405 H1400" stroke="#70d6ca" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M1400 405 l-20 -12 v24z M560 405 l-20 -12 v24z M1030 405 l-20 -12 v24z" fill="#70d6ca"/>
  <g filter="url(#s)"><rect x="110" y="310" width="280" height="190" rx="22" fill="#11233d" stroke="#2c4b70"/><rect x="560" y="270" width="300" height="270" rx="22" fill="#17394a" stroke="#54cfc1" stroke-width="2"/><rect x="1030" y="310" width="260" height="190" rx="22" fill="#11233d" stroke="#2c4b70"/></g>
  <text x="145" y="365" fill="#70d6ca" font-family="Arial, sans-serif" font-size="18" font-weight="700">INPUT</text><text x="145" y="412" fill="#f4f7ff" font-family="Arial, sans-serif" font-size="32" font-weight="700">요청 · 제약</text><text x="145" y="452" fill="#aabbd5" font-family="Arial, sans-serif" font-size="20">목표와 경계를 읽는다</text>
  <text x="595" y="330" fill="#8cf2e6" font-family="Arial, sans-serif" font-size="18" font-weight="700">PORTABLE REASON</text><text x="595" y="380" fill="#fff" font-family="Arial, sans-serif" font-size="33" font-weight="700">판단의 골격</text><text x="595" y="423" fill="#c0d8dd" font-family="Arial, sans-serif" font-size="20">목적  ·  제약</text><text x="595" y="457" fill="#c0d8dd" font-family="Arial, sans-serif" font-size="20">선택  ·  재검토 조건</text>
  <text x="1065" y="365" fill="#70d6ca" font-family="Arial, sans-serif" font-size="18" font-weight="700">HANDOFF</text><text x="1065" y="412" fill="#f4f7ff" font-family="Arial, sans-serif" font-size="32" font-weight="700">실행 · 검토</text><text x="1065" y="452" fill="#aabbd5" font-family="Arial, sans-serif" font-size="20">다음 판단을 열어 둔다</text>
  <line x1="110" y1="650" x2="1490" y2="650" stroke="#314666"/><text x="110" y="722" fill="#e7eefc" font-family="Arial, sans-serif" font-size="28" font-weight="700">설명은 결론을 방어하는 문서가 아니라, 수정 가능한 협업의 인터페이스다.</text><text x="110" y="770" fill="#9fb0cc" font-family="Arial, sans-serif" font-size="20">ELLIM · THOUGHTS / 2026.09.02</text>
</svg>